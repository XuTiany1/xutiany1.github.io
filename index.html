<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<meta name="description" content="Personal academic homepage.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<!-- This file is just the skeleton. All content lives in data/. -->
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="navlink" href="#top">about</a>
    <a class="navlink" href="blog/index.html">blog</a>
    <a class="navlink" href="coursenote/index.html">course notes</a>
    <button class="iconbtn" id="open-search" aria-label="Search papers">
      <span class="kbd" id="kbd-hint">⌘ k</span>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconbtn" id="toggle-theme" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</nav>

<main id="top">
  <h1 class="name"><b id="first-name"></b> <span id="last-name"></span></h1>

  <div class="bio" id="bio"></div>

  <div class="social-top" id="social"></div>

  <section class="updates" id="news"></section>

  <h2 class="section">Papers</h2>

  <p class="scholar-note" id="scholar-note"></p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="selected" aria-selected="true">Selected</button>
    <button class="tab" role="tab" data-tab="all" aria-selected="false">All</button>
  </div>

  <div id="pub-list"></div>

  <h2 class="section" id="education-heading">Education</h2>
  <section class="card" id="education"></section>

  <h2 class="section" id="internships-heading">Internships</h2>
  <section class="card" id="internships"></section>

  <h2 class="section" id="awards-heading">Awards &amp; Scholarships</h2>
  <section class="card" id="awards"></section>
</main>

<div class="overlay" id="overlay">
  <div class="searchbox" role="dialog" aria-modal="true" aria-label="Search papers">
    <input id="search-input" type="text" placeholder="Search papers…" autocomplete="off">
    <ul class="results" id="results"></ul>
  </div>
</div>

<!-- data first, renderer last -->
<script src="data/config.js"></script>
<script src="data/news.js"></script>
<script src="data/publications.js"></script>
<script src="data/education.js"></script>
<script src="data/internships.js"></script>
<script src="data/awards.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
